spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: air541018
      client-type: lettuce
      timeout: 5000
      lettuce:
        pool:
          min-idle: 2
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1
  #开发库
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    #url: jdbc:p6spy:postgresql://192.168.10.29:5432/airedge2db
    url: jdbc:p6spy:postgresql://127.0.0.1:5432/239?rewriteBatchedStatements=true
    username: postgres
    password: air20220401
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      #最大连接数
      maximum-pool-size: 10
      #最小空闲连接数量
      minimum-idle: 3
      #连接超时时间（毫秒）
      connection-timeout: 30000
      #空闲连接超时时间（毫秒）
      idle-timeout: 600000
      #连接最大存活时间（毫秒）
      max-lifetime: 1800000
      pool-name: HikariPool-air-dev
      auto-commit: true
