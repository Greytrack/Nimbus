module.log=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=Execute-SQL: %(sql) \n| %(currentTime) | SQL time-consuming: %(executionTime) ms | Connection-information: %(category)-%(connectionId)
appender=com.p6spy.engine.spy.appender.StdoutLogger
excludecategories=info,debug,result,resultset,batch
dateformat=yyyy-MM-dd HH:mm:ss
dirverlist=com.p6spy.engine.spy.P6SpyDriver
outageDetection=true
outageDetectionInterval=3
filter=true
