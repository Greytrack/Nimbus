excludeSqlPatterns=^SELECT\s+.*FROM\s+qrtz_.*
exclude=^(.*(qrtz_TRIGGERS|qrtz_SCHEDULER_STATE|qrtz_FIRED_TRIGGERS|price_history).*)$
sqlexpression=^(?!.*(qrtz_TRIGGERS).*)(.*)$,^(?!.*(qrtz_SCHEDULER_STATE).*)(.*)$,^(?!.*(qrtz_FIRED_TRIGGERS).*)(.*)$
