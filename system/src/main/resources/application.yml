server:
  port: 8088
  ip: localhost
  servlet:
    context-path: /plm
  http2:
    enabled: true

spring:
  application:
    name: airedge-backend-2.1
  profiles:
    active: @profiles.active@
  messages:
    basename: i18n/messages,i18n/validations
  logging:
    level:
      org.springframework.security:
        - error
        - error
      org.springframework.web: error
  config:
    import: classpath:swagger.yml
  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: airedge-service-scheduler
            instanceId: AUTO
          threadPool:
            threadCount: 50
            threadPriority: 5
            threadNamePrefix: airedge-service-scheduler-thread-pool
          jobStore:
            isClustered: true
            tablePrefix: qrtz_
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            clusterCheckinInterval: 15000
            misfireThreshold: 1000            # 定义Misfire容忍阈值（毫秒）

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: true
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300

#mybatis plus 设置
mybatis-plus:
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.airedgesoft.plm.sdkimpl.*.*.po
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    enable-sql-runner: true
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: assign_id
      # 默认数据库表下划线命名
      table-underline: true
      # 逻辑删除全局值（1表示已删除，这也是Mybatis Plus的默认配置）
      logic-delete-value: 1
      # 逻辑未删除全局值（0表示未删除，这也是Mybatis Plus的默认配置）
      logic-not-delete-value: 0
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true

##knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.airedgesoft.*: info
    org.quartz: INFO
  file:
    path: logs

javamelody:
  # 启用JavaMelody自动配置(可选，默认值:true)
  enabled: false
  # 从监控中排除数据源名称(可选，逗号分隔)
  #  excluded-datasources: HikariDataSource
  # 初始化JavaMelody参数(可选)
  # 参见: https://github.com/javamelody/javamelody/wiki/UserGuide#6-optional-parameters
  init-parameters:
    # 记录HTTP请求:
    log: true
    # 从监控中排除图像，css，字体和js url:
    #url-exclude-pattern: (/webjars/.*|/css/.*|/images/.*|/fonts/.*|/js/.*)
    # 聚合HTTP请求中的数字:
    http-transform-pattern: \d+
    # 添加基本权限:
    authorized-users: admin:123456
    # 更改默认存储目录:
    storage-directory: /tmp/javamelody
    # 修改默认的"/monitoring"路径:
    monitoring-path: /monitoring
  spring-monitoring-enabled: true